@if (isOpen()) {
<div class="modal-backdrop" (click)="onBackdropClick()">
    <div class="modal-panel modal-large" (click)="$event.stopPropagation()">

        <div class="modal-header">
            <h2>Registrar Bloques Lectivos</h2>

            <button
                type="button"
                class="close-btn"
                (click)="onCancel()"
                aria-label="Cerrar">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form
            [formGroup]="form"
            (ngSubmit)="onSubmit()"
            class="modal-form">

            <!-- Año -->

            <div class="field">

                <label>
                    Año lectivo
                    <span class="required">*</span>
                </label>

                <div class="filter-select">

                    <i class="fa-solid fa-calendar-days"></i>

                    <select formControlName="year_id">

                        <option [ngValue]="null">
                            Seleccione un año
                        </option>

                        @for(year of years(); track year.id){

                        <option [ngValue]="year.id">
                            {{ year.id }} - {{ year.year }}
                        </option>

                        }

                    </select>

                </div>

                @if(form.get('year_id')?.invalid &&
                form.get('year_id')?.touched){

                <span class="field-error">
                    Seleccione un año.
                </span>

                }

            </div>

            <div class="blocks-grid">

                @for(block of teachingBlockOptions; track block){

                <div class="block-card">

                    <h3>{{ block }}</h3>

                    <div class="field">

                        <label>
                            Fecha de inicio
                            <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            [formControlName]="'start_day_' + $index">

                    </div>
                    <br>
                    <div class="field">

                        <label>
                            Fecha de fin
                            <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            [formControlName]="'end_day_' + $index">

                    </div>
                    <br>
                    <div class="field">

                        <label>
                            Descripción
                        </label>

                        <textarea
                            rows="2"
                            [formControlName]="'description_' + $index"
                            placeholder="Opcional">
                        </textarea>

                    </div>

                </div>

                }

            </div>

            @if(errorMessage){

            <div class="form-error">
                {{ errorMessage }}
            </div>

            }

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn-secondary"
                    (click)="onCancel()">
                    Cancelar
                </button>

                <button
                    class="btn-primary"
                    type="submit"
                    [disabled]="submitting">

                    @if(submitting){

                    <span>Guardando...</span>

                    }@else{

                    <span>Registrar bloques lectivos</span>

                    }

                </button>

            </div>

        </form>

    </div>
</div>
}
