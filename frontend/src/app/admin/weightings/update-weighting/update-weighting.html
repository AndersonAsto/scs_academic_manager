@if (isOpen()) {
<div class="modal-backdrop" (click)="onBackdropClick()">
    <div class="modal-panel modal-large" (click)="$event.stopPropagation()">
        <div class="modal-header">

            <h2>Actualizar Ponderación</h2>
            <button type="button" class="close-btn" (click)="onCancel()">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-form">

            <!-- Año -->
            <div class="field">
                <label>
                    Año lectivo
                </label>
                <div class="filter-select">
                    <i class="fa-solid fa-calendar-days"></i>
                    <select formControlName="year_id" [disabled]="true">
                        @for(year of years(); track year.id){
                        <option [ngValue]="year.id">
                            {{ year.id }} - {{ year.year }}
                        </option>
                        }
                    </select>
                </div>
            </div>

            <!-- Tipo -->
            <div class="field">
                <label>
                    Tipo de Ponderación
                </label>
                <div class="filter-select">
                    <i class="fa-solid fa-layer-group"></i>
                    <select formControlName="type" [disabled]="true">
                        @for(weight of weightingOptions; track weight){
                        <option [ngValue]="weight">
                            {{ weight }}
                        </option>
                        }
                    </select>
                </div>
            </div>

            <!-- Ponderación -->
            <div class="field">
                <label>
                    Ponderación
                    <span class="required">*</span>
                </label>
                <input type="number" min="1" formControlName="weighting">
                @if(form.get('weighting')?.invalid &&
                form.get('weighting')?.touched){
                <span class="field-error">
                    El valor de ponderación es obligatorio.
                </span>
                }
            </div>

            <!-- Descripción -->
            <div class="field">
                <label>
                    Descripción
                </label>
                <textarea rows="3" formControlName="description" placeholder="Opcional">
                </textarea>
            </div>
            @if(errorMessage){
            <div class="form-error">
                {{ errorMessage }}
            </div>
            }

            <div class="modal-actions">
                <button type="button" class="btn-secondary" (click)="onCancel()">
                    Cancelar
                </button>
                <button type="submit" class="btn-primary" [disabled]="submitting">
                    @if(submitting){
                    <span>Guardando...</span>
                    }@else{
                    <span>Guardar cambios</span>
                    }
                </button>
            </div>
        </form>
    </div>
</div>
}
