@if (isOpen()) {

<div class="modal-backdrop" (click)="onBackdropClick()">

    <div class="modal-panel modal-large" (click)="$event.stopPropagation()">

        <div class="modal-header">

            <h2>Actualizar Día Lectivo</h2>

            <button type="button" class="close-btn" (click)="onCancel()">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form class="modal-form" [formGroup]="form" (ngSubmit)="onSubmit()">

            <div class="field">
                <label>Año Lectivo</label>

                <input type="number" formControlName="year">
            </div>

            <div class="field">

                <label>Bloque Lectivo</label>

                <input type="text" formControlName="teaching_block">

            </div>

            <div class="field">

                <label>Fecha</label>

                <input type="date" formControlName="school_day">

            </div>

            <div class="field">

                <label>Día</label>

                <input type="text" formControlName="day">

            </div>

            <div class="field">

                <label>Semana</label>

                <input type="number" formControlName="week_number">

            </div>

            <div class="field">

                <label>
                    Tipo
                    <span class="required">*</span>
                </label>

                <div class="filter-select">

                    <i class="fa-solid fa-calendar-check"></i>

                    <select formControlName="type">

                        @for(type of typeOptions; track type){

                        <option [value]="type">
                            {{ type }}
                        </option>

                        }

                    </select>

                </div>

            </div>

            <div class="field">

                <label>Descripción</label>

                <textarea rows="3" formControlName="description" placeholder="Opcional">
                </textarea>

            </div>

            @if(errorMessage){

            <div class="form-error">

                {{ errorMessage }}

            </div>

            }

            <div class="modal-actions">

                <button type="button" class="btn-secondary" (click)="onCancel()">

                    Cancelar

                </button>

                <button class="btn-primary" type="submit" [disabled]="submitting">

                    @if(submitting){

                    <span>Guardando...</span>

                    }@else{

                    <span>Guardar cambios</span>

                    }

                </button>

            </div>

        </form>

    </div>

</div>

}
